services:
  # 1. Python FastAPI Backend Agent
  - type: web
    name: ghostprotocol-agent
    runtime: python
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ghost_agent:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DEMO_MODE
        value: "true"
      - key: NEAR_NETWORK
        value: testnet
      - key: CONTRACT_ID
        value: ghostprotocol.testnet
      - key: TIMEOUT_PERIOD_MS
        value: "50000"
      - key: WARNING_THRESHOLD_MS
        value: "15000"

  # 2. Vite React Frontend
  - type: web
    name: ghostprotocol-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ghostprotocol-agent
          property: url
